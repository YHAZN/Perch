; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/build_time.py
lib_deps =
    lvgl/lvgl@9.2.2
    h2zero/NimBLE-Arduino@~1.4.3
    bblanchon/ArduinoJson@^7.4.2
    ; OV5640 autofocus firmware loader (MIT), pinned to the reviewed commit
    https://github.com/0015/ESP32-OV5640-AF.git#b22b2bc1c1d3ac0f2f18c3f121f82b189889c79e
; Core/driver log lines from other tasks would interleave with framed USB
; screen transfers and corrupt them. Firmware prints its own status lines.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
