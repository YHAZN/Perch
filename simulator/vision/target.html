<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibration target</title><style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#dae3f3;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.marker{position:fixed;width:clamp(36px,8vmin,120px);aspect-ratio:1;transform:translate(-50%,-50%);background:white;color:#111;border:8px solid #111;outline:4px solid white;display:grid;place-items:center;font-size:clamp(24px,4vmin,60px);font-weight:700}.m1{left:8%;top:8%}.m2{left:92%;top:8%}.m3{left:92%;top:92%}.m4{left:8%;top:92%}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:200;line-height:1}aside{position:fixed;left:50%;top:65%;transform:translateX(-50%);text-align:center;max-width:500px;color:#8290a7;font-size:13px}button{background:#e7eefc;color:#1a2435;border:0;border-radius:20px;padding:12px 20px;font:inherit;cursor:pointer}body:fullscreen aside{opacity:.25}
</style></head><body><div class="marker m1">1</div><div class="marker m2">2</div><div class="marker m3">3</div><div class="marker m4">4</div><div id="cross">+</div><aside><button id="fullscreen">Enter full screen</button><p>Mark the centres of 1–4 in the camera image. Use the centre cross as a separate check.</p><p>Manual reference markers—not automatic tracking.</p></aside><script type="module">
const channel=new BroadcastChannel('perch-calibration-target');
function report(){channel.postMessage({width:innerWidth,height:innerHeight,fullscreen:!!document.fullscreenElement});}
document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen();
addEventListener('resize',report);document.addEventListener('fullscreenchange',report);setInterval(report,1000);report();
</script></body></html>
